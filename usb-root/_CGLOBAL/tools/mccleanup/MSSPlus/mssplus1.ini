[PRE]
; operations to perform prior to this uninstallation

[POST]
; operations to perform after this uninstallation

[UNINSTALL]

10=uninstall_mssplus
10:64bit=uninstall_mssplus_64

[uninstall_mssplus]
stop_mss_service
delete_mss_service
terminate_process1
terminate_process2
terminate_process3
remove_reg_keys
remove_directory_programfiles_mfe_mss
remove_directory_programfiles_mfe_mss_86
remove_directory_programfiles_mfe
remove_directory_programfiles_mfe_86
remove_mssplus_pgmdata
remove_mcafee_pgmdata
remove_start_menu_shortcut
remove_desktop_shortcut

[uninstall_mssplus_64]
stop_mss_service
delete_mss_service
terminate_process1
terminate_process2
terminate_process3
remove_reg_keys_64
remove_directory_programfiles_mfe_mss
remove_directory_programfiles_mfe_mss_86
remove_directory_programfiles_mfe
remove_directory_programfiles_mfe_86
remove_mssplus_pgmdata
remove_mcafee_pgmdata
remove_start_menu_shortcut
remove_desktop_shortcut


[remove_reg_keys]
type=regkeylist
extpath=RegKeyList1.txt
action=remove

[remove_reg_keys_64]
type=regkeylist
extpath=RegKeyList1.txt
action=remove
view=64

[remove_directory_programfiles_mfe]
type=directory
path=%PROGRAMFILES%\McAfee
action=forceremoveonreboot

[remove_directory_programfiles_mfe_86]
type=directory
path=%PROGRAMFILES(x86)%\McAfee
action=forceremoveonreboot

[remove_directory_programfiles_mfe_mss_86]
type=directory
path=%PROGRAMFILES(x86)%\McAfee Security Scan
action=forceremoveonreboot

[remove_directory_programfiles_mfe_mss]
type=directory
path=%PROGRAMFILES%\McAfee Security Scan
action=forceremoveonreboot

[remove_mssplus_pgmdata]
type=directory
path=$MC_ReplaceEnvVar{PROGRAMDATA}\McAfee Security Scan
action=forceremoveonreboot

[remove_mcafee_pgmdata]
type=directory
path=$MC_ReplaceEnvVar{PROGRAMDATA}\McAfee
action=forceremoveonreboot

[remove_start_menu_shortcut]
type=file
action=RemoveMatching
path=$MC_ReplaceEnvVar{PROGRAMDATA}\Microsoft\Windows\Start Menu\programs\McAfee Security Scan Plus\McAfee*.lnk

[remove_desktop_shortcut]
type=file
path=%COMMONDESKTOP%\McAfee Security Scan Plus.lnk

[terminate_process1]
type=terminate_process
name=mc-webview-cnt.exe


[terminate_process2]
type=terminate_process
name=SSScheduler.exe


[terminate_process3]
type=terminate_process
name=McUpdaterModule.exe


[stop_mss_service]
type=cmd
cmd=net stop "mccomponenthostservice" 

[delete_mss_service]
type=cmd
cmd=sc delete "mccomponenthostservice"
